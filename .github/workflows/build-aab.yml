name: Build WebView AAB

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-aab.yml'
      - 'signing.keystore'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android 36 Platform & Accept Licenses
        run: |
          if [ ! -f "signing.keystore" ]; then
            echo "::error::signing.keystore bulunamadı!"
            exit 1
          fi
          echo "signing.keystore başarıyla doğrulandı!"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Create Android WebView Project
        run: |
          mkdir -p android-project/app/src/main/java/io/github/cowboytr/twa
          mkdir -p android-project/app/src/main/res/drawable
          mkdir -p android-project/app/src/main/res/values

          # 1. signing.keystore ve gerçek icon.png kopyala
          cp signing.keystore android-project/app/signing.keystore
          if [ -f "icon.png" ]; then
            cp icon.png android-project/app/src/main/res/drawable/ic_launcher.png
          fi

          # 2. gradle.properties
          cat << 'EOF' > android-project/gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 3. settings.gradle
          cat << 'EOF' > android-project/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FalimaBak"
          include ':app'
          EOF

          # 4. root build.gradle
          cat << 'EOF' > android-project/build.gradle
          plugins {
              id 'com.android.application' version '8.4.2' apply false
          }
          EOF

          # 5. app/build.gradle (HEDEF SDK: 36, SÜRÜM KODU: 3)
          cat << 'EOF' > android-project/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'io.github.cowboytr.twa'
              compileSdk 36

              defaultConfig {
                  applicationId "io.github.cowboytr.twa"
                  minSdk 24
                  targetSdk 36
                  versionCode 3
                  versionName "1.0.2"
              }

              signingConfigs {
                  release {
                      storeFile file("signing.keystore")
                      storePassword "b7O0VCXK6A4A"
                      keyAlias "my-key-alias"
                      keyPassword "b7O0VCXK6A4A"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF

          # 6. strings.xml & themes.xml
          cat << 'EOF' > android-project/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Falıma Bak</string>
          </resources>
          EOF

          cat << 'EOF' > android-project/app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.FalimaBak" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:statusBarColor">#0d071a</item>
              </style>
          </resources>
          EOF

          # 7. AndroidManifest.xml
          cat << 'EOF' > android-project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@drawable/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.FalimaBak"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          # 8. MainActivity.java
          cat << 'EOF' > android-project/app/src/main/java/io/github/cowboytr/twa/MainActivity.java
          package io.github.cowboytr.twa;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.annotation.Nullable;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;
              private ValueCallback<Uri[]> mFilePathCallback;
              private static final int FILE_CHOOSER_REQUEST_CODE = 1001;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, WebChromeClient.FileChooserParams fileChooserParams) {
                          if (mFilePathCallback != null) {
                              mFilePathCallback.onReceiveValue(null);
                          }
                          mFilePathCallback = filePathCallback;
                          Intent intent = fileChooserParams.createIntent();
                          try {
                              startActivityForResult(intent, FILE_CHOOSER_REQUEST_CODE);
                          } catch (ActivityNotFoundException e) {
                              mFilePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.loadUrl("https://cowboytr.github.io/falima-bak/");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, @Nullable Intent data) {
                  if (requestCode == FILE_CHOOSER_REQUEST_CODE) {
                      if (mFilePathCallback != null) {
                          Uri[] results = null;
                          if (resultCode == Activity.RESULT_OK && data != null) {
                              if (data.getClipData() != null) {
                                  int count = data.getClipData().getItemCount();
                                  results = new Uri[count];
                                  for (int i = 0; i < count; i++) {
                                      results[i] = data.getClipData().getItemAt(i).getUri();
                                  }
                              } else if (data.getData() != null) {
                                  results = new Uri[]{ data.getData() };
                              }
                          }
                          mFilePathCallback.onReceiveValue(results);
                          mFilePathCallback = null;
                      }
                  } else {
                      super.onActivityResult(requestCode, resultCode, data);
                  }
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK && webView.canGoBack()) {
                      webView.goBack();
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
          EOF

      # 9. Build AAB Bundle (Gradle 8.7 ile tam uyumlu)
      - name: Build AAB Bundle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          export PATH=$PWD/gradle-8.7/bin:$PATH
          cd android-project
          gradle bundleRelease --no-daemon

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: falima-bak-webview-aab
          path: android-project/app/build/outputs/bundle/release/app-release.aab
