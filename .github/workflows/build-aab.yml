name: Build WebView AAB

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-aab.yml'
      - 'signing.keystore'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android 36 Platform & Accept Licenses
        run: |
          if [ ! -f "signing.keystore" ]; then
            echo "::error::signing.keystore bulunamadı!"
            exit 1
          fi
          echo "signing.keystore başarıyla doğrulandı!"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Create Android WebView Project with Native TTS
        run: |
          mkdir -p android-project/app/src/main/java/com/zirvelabs/falimabak
          mkdir -p android-project/app/src/main/res/drawable
          mkdir -p android-project/app/src/main/res/values

          # 1. signing.keystore ve gerçek icon.png kopyala
          cp signing.keystore android-project/app/signing.keystore
          if [ -f "icon.png" ]; then
            cp icon.png android-project/app/src/main/res/drawable/ic_launcher.png
          fi

          # 2. gradle.properties
          cat << 'EOF' > android-project/gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 3. settings.gradle
          cat << 'EOF' > android-project/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FalimaBak"
          include ':app'
          EOF

          # 4. root build.gradle
          cat << 'EOF' > android-project/build.gradle
          plugins {
              id 'com.android.application' version '8.4.2' apply false
          }
          EOF

          # 5. app/build.gradle (SÜRÜM KODU: 4 - ÜRETİM SÜRÜMÜ)
          cat << 'EOF' > android-project/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.zirvelabs.falimabak'
              compileSdk 36

              defaultConfig {
                  applicationId "com.zirvelabs.falimabak"
                  minSdk 24
                  targetSdk 36
                  versionCode 4
                  versionName "1.0.3"
              }

              signingConfigs {
                  release {
                      storeFile file("signing.keystore")
                      storePassword "b7O0VCXK6A4A"
                      keyAlias "my-key-alias"
                      keyPassword "b7O0VCXK6A4A"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF

          # 6. strings.xml & themes.xml
          cat << 'EOF' > android-project/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Falıma Bak</string>
          </resources>
          EOF

          cat << 'EOF' > android-project/app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.FalimaBak" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:statusBarColor">#0d071a</item>
              </style>
          </resources>
          EOF
